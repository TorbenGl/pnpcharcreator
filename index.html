<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Bestie von Gévaudan — Charaktererschaffung</title>
<meta name="description" content="Geführter Charakter-Assistent für ein Savage-Worlds-artiges Horror-Rollenspiel im Frankreich von 1764. Erklärt die Regeln Schritt für Schritt und exportiert einen Charakterbogen als PDF.">
<style>
  :root{
    --bg:#171310; --bg2:#1f1813; --panel:#241c15; --panel2:#2c231a;
    --ink:#ece0cb; --muted:#b39c7e; --faint:#8a7357;
    --line:#4a3a29; --line2:#3a2d20;
    --blut:#9d2323; --blut2:#c23a2f; --gold:#c9a24b; --gold2:#e3c072;
    --gut:#6f9b56; --warn:#d98b3a; --bad:#c23a2f;
    --radius:10px; --shadow:0 8px 30px rgba(0,0,0,.45);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--serif); color:var(--ink); line-height:1.55;
    background:
      radial-gradient(1200px 600px at 50% -10%, #2a2018 0%, rgba(42,32,24,0) 60%),
      radial-gradient(900px 500px at 90% 110%, #241a14 0%, rgba(36,26,20,0) 55%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--gold2)}
  h1,h2,h3,h4{font-weight:700; line-height:1.2; margin:0 0 .4em}
  h1{font-size:1.9rem; letter-spacing:.5px}
  h2{font-size:1.4rem; color:var(--gold2)}
  h3{font-size:1.12rem; color:var(--gold2)}
  p{margin:0 0 .8em}
  small{color:var(--muted)}
  .wrap{max-width:1000px; margin:0 auto; padding:0 16px 80px}

  /* Topbar */
  .topbar{position:sticky; top:0; z-index:20; background:linear-gradient(#1c1511,#191310);
    border-bottom:1px solid var(--line); box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .topbar .inner{max-width:1000px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px; min-width:0}
  .brand .moon{font-size:1.4rem; filter:drop-shadow(0 0 6px rgba(201,162,75,.5))}
  .brand b{font-size:1.02rem; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .brand span{color:var(--muted); font-size:.8rem}
  .spacer{flex:1 1 auto}
  .tools{display:flex; gap:8px; flex-wrap:wrap}

  /* Buttons */
  button{font-family:inherit; font-size:.92rem; cursor:pointer; color:var(--ink);
    background:linear-gradient(#33271c,#28201a); border:1px solid var(--line);
    padding:9px 14px; border-radius:8px; transition:.12s; line-height:1.1}
  button:hover:not(:disabled){border-color:var(--gold); color:var(--gold2)}
  button:disabled{opacity:.38; cursor:not-allowed}
  button.prim{background:linear-gradient(#a5301f,#7f2318); border-color:#c2513a; color:#fff}
  button.prim:hover:not(:disabled){filter:brightness(1.08); color:#fff; border-color:#e0836a}
  button.ghost{background:transparent}
  button.small{padding:5px 9px; font-size:.82rem}
  button.round{width:34px; height:34px; padding:0; font-size:1.1rem; border-radius:8px; display:inline-flex; align-items:center; justify-content:center}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px}

  /* Progress */
  .progress{display:flex; gap:6px; overflow-x:auto; padding:12px 0 4px; margin-bottom:6px; scrollbar-width:thin}
  .progress button{white-space:nowrap; font-size:.8rem; padding:6px 10px; border-radius:20px; background:transparent; color:var(--muted)}
  .progress button .n{display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; border-radius:50%; background:#3a2d20; color:var(--ink); font-size:.72rem; margin-right:6px}
  .progress button.done{color:var(--ink)}
  .progress button.done .n{background:#5a4a2a; color:var(--gold2)}
  .progress button.active{color:var(--gold2); border:1px solid var(--gold)}
  .progress button.active .n{background:var(--blut); color:#fff}

  /* Panel / cards */
  .panel{background:linear-gradient(var(--panel),var(--bg2)); border:1px solid var(--line);
    border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); margin-bottom:18px}
  .lead{color:var(--muted)}
  .card{background:var(--panel2); border:1px solid var(--line2); border-radius:9px; padding:14px}
  .grid{display:grid; gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:720px){ .g2,.g3{grid-template-columns:1fr} }

  /* Teaching boxes */
  .lehr{border-left:3px solid var(--gold); background:rgba(201,162,75,.07); padding:12px 14px; border-radius:0 8px 8px 0; margin:0 0 16px}
  .lehr h4{color:var(--gold2); margin:0 0 .3em; font-size:1rem}
  .beispiel{border-left:3px solid var(--blut2); background:rgba(194,58,47,.08); padding:10px 14px; border-radius:0 8px 8px 0; margin:0 0 14px; font-size:.95rem}
  .beispiel b{color:var(--gold2)}
  details.mehr{margin:2px 0 14px; border:1px solid var(--line2); border-radius:8px; background:rgba(0,0,0,.15)}
  details.mehr summary{cursor:pointer; padding:9px 12px; color:var(--gold2); font-size:.9rem; user-select:none}
  details.mehr .body{padding:0 14px 12px}
  .tip{color:var(--faint); font-size:.85rem}

  /* Forms */
  label.field{display:block; margin-bottom:12px}
  label.field .lab{display:block; font-size:.82rem; color:var(--muted); margin-bottom:4px; letter-spacing:.3px}
  input[type=text], input[type=number], select, textarea{
    width:100%; font-family:inherit; font-size:.98rem; color:var(--ink);
    background:#15100c; border:1px solid var(--line); border-radius:7px; padding:9px 11px}
  textarea{resize:vertical; min-height:78px; line-height:1.5}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--gold)}
  .hint{font-size:.8rem; color:var(--faint); margin-top:3px}

  /* Budget bar */
  .budget{position:sticky; top:58px; z-index:10; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:linear-gradient(#241b13,#1d160f); border:1px solid var(--line); border-radius:9px; padding:10px 14px; margin-bottom:16px}
  .budget .b{font-size:.95rem}
  .budget .b b{font-size:1.15rem}
  .budget .ok{color:var(--gut)} .budget .over{color:var(--bad)} .budget .zero{color:var(--gold2)}

  /* Stepper rows */
  .steprow{display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line2); border-radius:9px; background:var(--panel2); margin-bottom:9px}
  .steprow .nm{flex:1 1 auto; min-width:0}
  .steprow .nm b{display:block}
  .steprow .nm small{color:var(--faint)}
  .die{display:inline-flex; align-items:center; justify-content:center; min-width:52px; height:38px; padding:0 8px;
    font-weight:700; font-size:1.05rem; color:var(--gold2); background:#15100c; border:1px solid var(--line); border-radius:8px}
  .die.untr{color:var(--faint); font-weight:400; font-size:.82rem}
  .cost{min-width:64px; text-align:right; font-size:.82rem; color:var(--faint)}
  .attrgroup{margin:18px 0}
  .attrgroup > .ttl{display:flex; align-items:baseline; gap:8px; margin-bottom:8px; border-bottom:1px solid var(--line2); padding-bottom:4px}
  .attrgroup > .ttl b{color:var(--gold2)}

  /* selectable list (nachteile / talente) */
  .selrow{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line2); border-radius:9px; background:var(--panel2); margin-bottom:9px; cursor:pointer; transition:.12s}
  .selrow:hover{border-color:var(--faint)}
  .selrow.on{border-color:var(--gold); background:rgba(201,162,75,.09)}
  .selrow .box{flex:none; width:22px; height:22px; border:1px solid var(--line); border-radius:5px; display:flex; align-items:center; justify-content:center; margin-top:2px; color:var(--gold2)}
  .selrow.on .box{background:var(--blut); border-color:var(--blut2); color:#fff}
  .selrow .txt b{display:block}
  .selrow .txt small{color:var(--muted)}
  .tag{display:inline-block; font-size:.68rem; letter-spacing:.5px; text-transform:uppercase; padding:2px 7px; border-radius:20px; border:1px solid var(--line); color:var(--muted); margin-left:6px; vertical-align:middle}
  .tag.gross{color:var(--blut2); border-color:var(--blut)}
  .tag.klein{color:var(--gold2); border-color:var(--gold)}

  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border:1px solid var(--line); border-radius:20px; background:var(--panel2); font-size:.9rem}
  .chip.on{border-color:var(--gold); background:rgba(201,162,75,.12); color:var(--gold2)}
  .chip .x{cursor:pointer; color:var(--muted)}
  .chip .x:hover{color:var(--bad)}

  .konzeptgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media(max-width:720px){ .konzeptgrid{grid-template-columns:1fr} }
  .konzept{padding:12px 14px; border:1px solid var(--line2); border-radius:9px; background:var(--panel2); cursor:pointer; transition:.12s}
  .konzept:hover{border-color:var(--faint)}
  .konzept.on{border-color:var(--gold); background:rgba(201,162,75,.09)}
  .konzept b{color:var(--gold2)}
  .konzept small{color:var(--muted); display:block; margin-top:3px}

  .nav{display:flex; justify-content:space-between; gap:12px; margin-top:22px}

  .banner{padding:10px 14px; border-radius:8px; margin:10px 0; font-size:.92rem}
  .banner.warn{background:rgba(217,139,58,.12); border:1px solid var(--warn); color:#f0c48a}
  .banner.bad{background:rgba(194,58,47,.12); border:1px solid var(--bad); color:#f0a99f}

  .rel-row{display:flex; gap:8px; margin-bottom:8px}
  .rel-row input{flex:1 1 auto}

  /* SL mode accent */
  body.sl .topbar{background:linear-gradient(#241010,#190b0b); border-bottom-color:#5a2222}
  .sl-badge{display:none; font-size:.7rem; text-transform:uppercase; letter-spacing:1px; color:#fff; background:var(--blut); padding:3px 8px; border-radius:20px}
  body.sl .sl-badge{display:inline-block}
  .instinkt-track{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px}
  .instinkt-track button{width:52px; height:52px; font-size:1.2rem; font-weight:700; border-radius:10px}
  .instinkt-track button.on{background:linear-gradient(#a5301f,#6f1d13); border-color:#e0836a; color:#fff}
  .stufe-info{border-left:3px solid var(--blut2); padding:8px 14px; background:rgba(194,58,47,.08); border-radius:0 8px 8px 0}
  .ausloeser{display:flex; flex-wrap:wrap; gap:8px}
  .ausloeser button{font-size:.85rem}

  /* ===== Character sheet / print ===== */
  #druckbereich{display:none}
  #druckbereich.zeige{display:block}
  .bogen{background:#f4ecdc; color:#20180f; border-radius:6px; padding:26px; box-shadow:var(--shadow);
    font-family:var(--serif); max-width:1000px; margin:0 auto 30px}
  .bogen .kopf{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:3px double #4a3320; padding-bottom:10px; margin-bottom:16px; gap:14px; flex-wrap:wrap}
  .bogen .kopf .tt{font-size:.7rem; letter-spacing:2px; text-transform:uppercase; color:#7a5a34}
  .bogen .kopf h2{color:#3a2513; margin:0; font-size:1.7rem}
  .bogen .kopf .meta{color:#5a4326; font-size:.9rem}
  .bogen .kopf .setting{text-align:right; color:#7a5a34; font-size:.82rem; font-style:italic}
  .bogen h3{color:#7a2318; border-bottom:1px solid #b79b72; padding-bottom:3px; margin:18px 0 8px; font-size:1.05rem; letter-spacing:.5px; text-transform:uppercase}
  .bogen .cols{display:grid; grid-template-columns:1fr 1fr; gap:22px}
  .bogen .cols3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
  .bogen .attr{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dotted #c2ab86}
  .bogen .attr b{color:#3a2513} .bogen .attr .v{font-weight:700; color:#7a2318}
  .bogen .derived{display:flex; gap:10px; flex-wrap:wrap}
  .bogen .stat{flex:1 1 90px; text-align:center; border:1px solid #a98d63; border-radius:6px; padding:8px 4px; background:#efe4cf}
  .bogen .stat .l{font-size:.65rem; text-transform:uppercase; letter-spacing:1px; color:#7a5a34}
  .bogen .stat .n{font-size:1.5rem; font-weight:700; color:#3a2513}
  .bogen ul{margin:0; padding-left:18px}
  .bogen li{margin-bottom:5px}
  .bogen li b{color:#3a2513}
  .bogen .sub{color:#5a4326; font-size:.9rem}
  .bogen .bennies .dot{display:inline-block; width:16px; height:16px; border-radius:50%; border:2px solid #7a2318; margin-right:5px; background:#d9b24a}
  .bogen .wounds{display:flex; gap:6px; flex-wrap:wrap}
  .bogen .wounds span{border:1px solid #7a5a34; border-radius:5px; padding:3px 9px; font-size:.82rem}
  .bogen .instinkt{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .bogen .instinkt .pip{width:30px; height:30px; border:2px solid #7a2318; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#7a2318}
  .bogen .instinkt .pip.on{background:#7a2318; color:#f4ecdc}
  .bogen .beast{border:1px solid #7a2318; border-radius:8px; padding:2px 16px 12px; background:#f0e2ca; margin-top:6px}
  .bogen .prose{white-space:pre-wrap; font-size:.94rem; color:#3a2c1c}
  .bogen .seite2{page-break-before:always; margin-top:26px}
  .bogen .foot{margin-top:20px; border-top:1px solid #b79b72; padding-top:8px; font-size:.72rem; color:#8a6a3f; text-align:center; font-style:italic}
  @media(max-width:720px){ .bogen .cols,.bogen .cols3{grid-template-columns:1fr} }

  @media print{
    body{background:#fff}
    .no-print{display:none !important}
    #druckbereich{display:block !important}
    .bogen{box-shadow:none; border-radius:0; padding:0; background:#fff; max-width:none}
    .bogen .stat, .bogen .beast{background:#fff}
    @page{size:A4; margin:12mm}
  }
</style>
</head>
<body>
<!-- Eingebettete Charakterdaten: beim Speichern "als HTML" wird dieser Block gefüllt. -->
<script id="charakter-daten" type="application/json"></script>

<div class="topbar no-print">
  <div class="inner">
    <div class="brand">
      <span class="moon">🌕</span>
      <div>
        <b>Die Bestie von Gévaudan <span class="sl-badge">SL · Bestien-Baumeister</span></b><br>
        <span>Charakter-Assistent · Savage-Worlds-Hausregeln</span>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <button class="small" data-action="print">📄 Als PDF speichern</button>
      <button class="small" data-action="save-html">💾 Speichern (HTML)</button>
      <button class="small ghost" data-action="menu-json">⋯</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="app" class="no-print"></div>
</div>

<div id="druckbereich"></div>

<!-- verstecktes Datei-Input für Import -->
<input type="file" id="fileimport" accept=".json,application/json,.html,text/html" style="display:none">

<script>
/* =========================================================================
   DIE BESTIE VON GÉVAUDAN — Charakter-Assistent (Single-File)
   Standardmodus = Spieler-Creator.  URL mit  #sl  = SL-/Bestien-Baumeister.
   Keine externen Abhängigkeiten. Speichern via localStorage + Self-Saving-HTML.
   ========================================================================= */

/* ---------- Regel-Konstanten (leicht anpassbar) ---------- */
const RULES = {
  START_WUERFEL: 'd4',
  ATTRIBUT_STEIGERUNGEN: 7,   // Anzahl Würfel-Stufen, die verteilt werden
  SKILL_PUNKTE: 12,
  START_BENNIES: 3,
  GRATIS_TALENTE: 1,
  MAX_NACHTEIL_GROSS: 1,
  MAX_NACHTEIL_KLEIN: 2,
};
const WUERFEL = ['d4','d6','d8','d10','d12'];
const idx = d => WUERFEL.indexOf(d);
const halbwert = { d4:2, d6:3, d8:4, d10:5, d12:6 }; // ½ des Würfelwerts

/* ---------- Daten: Attribute ---------- */
const ATTRIBUTE = [
  {id:'kraft',       name:'Kraft',        kurz:'Stärke, Nahkampf, körperliche Gewalt', bsp:'Eine Tür eintreten, ringen, mit der Axt zuschlagen.'},
  {id:'geschick',    name:'Geschick',     kurz:'Beweglichkeit, Reflexe, Präzision',    bsp:'Zielen und schießen, schleichen, über Dächer balancieren.'},
  {id:'zaehigkeit',  name:'Zähigkeit',    kurz:'Widerstand, Ausdauer, Schmerz',        bsp:'Treffer wegstecken, Kälte, Hunger und Wunden überstehen. Rein defensiv — meist ohne eigene Skills.'},
  {id:'verstand',    name:'Verstand',     kurz:'Wissen, Analyse, Wahrnehmung',         bsp:'Spuren lesen, Wunden versorgen, das Okkulte deuten.'},
  {id:'willenskraft',name:'Willenskraft', kurz:'Mut, Selbstbeherrschung, Präsenz',     bsp:'Der Angst widerstehen, überreden, einschüchtern.'},
];

/* ---------- Daten: Skills (je an ein Attribut gebunden) ---------- */
const SKILLS = [
  {attr:'kraft', id:'athletik', name:'Athletik'},
  {attr:'kraft', id:'nahkampf', name:'Nahkampf'},
  {attr:'kraft', id:'kraftakt', name:'Kraftakt'},
  {attr:'geschick', id:'schiessen', name:'Schießen'},
  {attr:'geschick', id:'heimlichkeit', name:'Heimlichkeit'},
  {attr:'geschick', id:'fingerfertigkeit', name:'Fingerfertigkeit'},
  {attr:'geschick', id:'reiten', name:'Reiten'},
  {attr:'geschick', id:'akrobatik', name:'Akrobatik'},
  {attr:'verstand', id:'wahrnehmung', name:'Wahrnehmung'},
  {attr:'verstand', id:'ermittlung', name:'Ermittlung'},
  {attr:'verstand', id:'medizin', name:'Medizin'},
  {attr:'verstand', id:'natur', name:'Natur'},
  {attr:'verstand', id:'ueberleben', name:'Überleben'},
  {attr:'verstand', id:'okkultismus', name:'Okkultismus'},
  {attr:'verstand', id:'handwerk', name:'Handwerk'},
  {attr:'willenskraft', id:'ueberreden', name:'Überreden'},
  {attr:'willenskraft', id:'einschuechtern', name:'Einschüchtern'},
  {attr:'willenskraft', id:'menschenkenntnis', name:'Menschenkenntnis'},
  {attr:'willenskraft', id:'fuehrung', name:'Führung'},
  {attr:'willenskraft', id:'taeuschen', name:'Täuschen'},
];
const skillName = id => (SKILLS.find(s=>s.id===id)||{}).name || id;
const attrName  = id => (ATTRIBUTE.find(a=>a.id===id)||{}).name || id;

/* ---------- Daten: Konzepte (Gévaudan) ---------- */
const KONZEPTE = [
  {id:'wolfsjaeger', name:'Wolfsjäger', text:'Kennt Wald, Fährte und Wolf. Wurde vom König oder vom Adel geholt, um die Bestie zu erlegen.'},
  {id:'dragoner', name:'Dragoner / Soldat', text:'Vom Regiment abkommandiert. Disziplin, Muskete und Bajonett — aber der Wald folgt anderen Regeln.'},
  {id:'wilderer', name:'Wilderer', text:'Lebt gesetzlos vom Wald. Niemand kennt die Schluchten besser — und niemand vertraut ihm.'},
  {id:'pfarrer', name:'Landpfarrer', text:'Hirte der verängstigten Gemeinde. Sucht Trost im Glauben, ringt mit dem, was kein Gebet vertreibt.'},
  {id:'kraeuterfrau', name:'Kräuterfrau / Heilerin', text:'Versorgt Wunden und Fieber. Steht zwischen altem Volksglauben und dem Verdacht der Hexerei.'},
  {id:'gelehrter', name:'Naturforscher', text:'Aus der Stadt, mit Notizbuch und Vernunft. Will die Bestie erklären — bis die Erklärungen versagen.'},
  {id:'schaefer', name:'Schäfer / Hirtin', text:'Draußen mit der Herde, wenn die Bestie kommt. Viele ihrer Opfer waren wie du.'},
  {id:'adlige', name:'Adlige(r) / Gutsherr', text:'Verantwortlich für Land und Leute. Ehre, Mittel und Einfluss — und viel zu verlieren.'},
  {id:'faehrtenleser', name:'Fährtenleser', text:'Liest den Boden wie andere ein Buch. Spürt, dass diese Fährte nicht von einem Wolf stammt.'},
  {id:'fremder', name:'Fremder / Reisender', text:'Kam mit dem Gerücht ins Land. Trägt eigene Geheimnisse — und weiß mehr über Bestien, als gut ist.'},
];

/* ---------- Daten: Nachteile (leichte SW-Variante) ---------- */
const NACHTEILE = [
  {id:'aberglaube', name:'Aberglaube', schwere:'klein', text:'Du deutest Omen und meidest Unglückszeichen; unter Druck folgst du Ritualen statt Vernunft.'},
  {id:'analphabet', name:'Analphabet', schwere:'klein', text:'Du kannst weder lesen noch schreiben — in Briefen, Karten und Dokumenten hilflos.'},
  {id:'arm', name:'Arm', schwere:'klein', text:'Kaum Besitz, kaum Rücklagen. Gute Ausrüstung ist für dich Luxus.'},
  {id:'alptraum', name:'Alpträume', schwere:'klein', text:'Bilder von Blut und Fängen rauben dir den Schlaf; nach Grauen brauchst du eine Willensprobe für erholsame Rast.'},
  {id:'loyal', name:'Loyal', schwere:'klein', text:'Du lässt Gefährten niemals im Stich — selbst wenn die Vernunft zur Flucht rät.'},

            kontrolle:0,verwandlung:'',lesart:'',notizen:''},
  };

function migrate(d){
  d = d||{};
  const b = defaultCharacter();
  // Auf frische Defaults mergen (nicht auf b selbst), damit neu ergänzte Felder
  // beim Laden alter Charaktere ihren Default behalten und additiv bleiben.
  const c = Object.assign({}, b, d);
  c.meta   = Object.assign({}, b.meta,   d.meta||{});
  c.profil = Object.assign({}, b.profil, d.profil||{});
  c.attribute = Object.assign({}, b.attribute, d.attribute||{});
  c.umwandlung = Object.assign({}, b.umwandlung, d.umwandlung||{});
  c.verletzungen = Object.assign({}, b.verletzungen, d.verletzungen||{});
  c.skills = d.skills||{};
  c.nachteile = d.nachteile||[];
  c.talente = d.talente||[];
  // Ausrüstung: alte String-Listen -> {name, menge}
  c.ausruestung = (d.ausruestung||[]).map(x => typeof x==='string' ? {name:x, menge:1} : {name:x.name, menge:x.menge||1}).filter(x=>x.name);
  c.beziehungen = d.beziehungen||[];
  c.bestie = Object.assign({}, b.bestie, d.bestie||{});
  c.bestie.silber = Object.assign({}, b.bestie.silber, (d.bestie&&d.bestie.silber)||{});
  c.bestie.kraefte = (d.bestie&&d.bestie.kraefte)||[];
  c.schema='gevaudan-character'; c.version=1;
  return c;
}

/* ---------- Persistenz ---------- */
const LS_KEY = 'gevaudan:aktuell';
function touch(){ character.meta.geaendert = new Date().toISOString(); }
function autosave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(character)); }catch(e){} }

function ladeStart(){
  let daten = null;
  const el = document.getElementById('charakter-daten');
  if(el && el.textContent.trim()){ try{ daten = JSON.parse(el.textContent); }catch(e){} }
  if(!daten){ try{ const s = localStorage.getItem(LS_KEY); if(s) daten = JSON.parse(s); }catch(e){} }
  character = daten ? migrate(daten) : defaultCharacter();
}

function dateiname(ext){
  const n = (character.meta.name||'charakter').trim().replace(/[^\wäöüÄÖÜß \-]/g,'').replace(/\s+/g,'_') || 'charakter';
  return n + '.' + ext;
}
function download(inhalt, name, typ){
  const blob = new Blob([inhalt], {type:typ});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function exportJson(){ download(JSON.stringify(character,null,2), dateiname('json'), 'application/json'); }

function speichernAlsHtml(){
  const safe = JSON.stringify(character).replace(/</g,'\\u003c');
  let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  html = html.replace(
    /(<script id="charakter-daten" type="application\/json">)[\s\S]*?(<\/script>)/,
    '$1' + safe + '$2'
  );
  download(html, dateiname('html'), 'text/html');
}

function importDatei(file){
  const reader = new FileReader();
  reader.onload = () => {
    let text = String(reader.result||'');
    let daten = null;
    // Versuch 1: reines JSON
    try{ daten = JSON.parse(text); }catch(e){}
    // Versuch 2: eingebettete HTML mit Datenblock
    if(!daten){
      const m = text.match(/<script id="charakter-daten" type="application\/json">([\s\S]*?)<\/script>/);
      if(m && m[1].trim()){ try{ daten = JSON.parse(m[1]); }catch(e){} }
    }
    if(!daten){ alert('Konnte keine Charakterdaten in der Datei finden.'); return; }
    character = migrate(daten); touch(); autosave(); renderApp();
    alert('Charakter geladen: ' + (character.meta.name||'(ohne Namen)'));
  };
  reader.readAsText(file);
}

/* =========================================================================
   BUDGET-LOGIK
   ========================================================================= */
function skillKosten(attrDie, zielDie){       // Gesamtkosten Untrainiert -> zielDie
  if(!zielDie) return 0;
  const ai = idx(attrDie), zi = idx(zielDie);
  let k = 0;
  for(let s=0; s<=zi; s++) k += (s <= ai) ? 1 : 2;
  return k;
}
function stepKostenRauf(attrDie, aktDie){     // Kosten für nächste Stufe
  const zi = aktDie==null ? 0 : idx(aktDie)+1;
  if(zi > 4) return null;
  return (zi <= idx(attrDie)) ? 1 : 2;
}
function nachteilPunkteVerdient(){
  let p=0; character.nachteile.forEach(n=> p += (n.schwere==='gross'?2:1));
  return Math.min(p, RULES.MAX_NACHTEIL_GROSS*2 + RULES.MAX_NACHTEIL_KLEIN*1); // Deckel 4
}
function umwandlungGenutzt(){ const u=character.umwandlung; return u.attribut*2 + u.talente*2 + u.skills*1; }
function nachteilPunkteFrei(){ return nachteilPunkteVerdient() - umwandlungGenutzt(); }

function attrBudget(){ return RULES.ATTRIBUT_STEIGERUNGEN + character.umwandlung.attribut; }
function attrGenutzt(){ let s=0; ATTRIBUTE.forEach(a=> s += idx(character.attribute[a.id])); return s; }
function talentBudget(){ return RULES.GRATIS_TALENTE + character.umwandlung.talente; }
function skillBudget(){ return RULES.SKILL_PUNKTE + character.umwandlung.skills; }
function skillGenutzt(){
  let s=0;
  for(const id in character.skills){
    const def = SKILLS.find(x=>x.id===id); if(!def) continue;
    s += skillKosten(character.attribute[def.attr], character.skills[id]);
  }
  return s;
}
function nachteilAnzahl(schwere){ return character.nachteile.filter(n=>n.schwere===schwere).length; }

/* ---------- abgeleitete Werte ---------- */
function derived(){
  const nk = character.skills['nahkampf'] || 'd4';   // untrainiert zählt als d4 für die Parade
  let parade = 2 + halbwert[nk];
  let robust = 2 + halbwert[character.attribute.zaehigkeit];
  if(character.talente.some(t=>t.id==='zaeh')) robust += 1;
  return { parade, robustheit:robust, bewegung:6 };
}
function benniesAnzeige(){ return character.bennies + (character.talente.some(t=>t.id==='glueckspilz')?1:0); }

   HILFS-RENDER
   ========================================================================= */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function feld(label, path, opts={}){
  const val = path.split('.').reduce((o,k)=>o?o[k]:'', character) || '';
  const ph = opts.ph ? ` placeholder="${esc(opts.ph)}"` : '';
  if(opts.area){
    return `<label class="field"><span class="lab">${esc(label)}</span>
      <textarea data-path="${path}"${ph} rows="${opts.rows||3}">${esc(val)}</textarea>
      ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}</label>`;
  }
  return `<label class="field"><span class="lab">${esc(label)}</span>
    <input type="text" data-path="${path}" value="${esc(val)}"${ph}>
    ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}</label>`;
}
function budgetBar(items){
  return `<div class="budget no-print">` + items.map(i=>{
    const cls = i.rest<0 ? 'over' : (i.rest===0 ? 'zero' : 'ok');
    return `<div class="b">${i.label}: <b class="${cls}">${i.used}</b> / ${i.total}${i.rest<0?` <span class="over">(${i.rest} — zu viel!)</span>`:i.rest>0?` <span class="tip">(${i.rest} übrig)</span>`:''}</div>`;
  }).join('') + `</div>`;
}

/* =========================================================================
   SCHRITTE (Spieler-Creator)
   ========================================================================= */
function renderSchritt(){
  const s = SCHRITTE[schritt].id;
  const fn = {
    willkommen:sWillkommen, grundlagen:sGrundlagen, setting:sSetting, konzept:sKonzept,
    identitaet:sIdentitaet, attribute:sAttribute, nachteile:sNachteile, skills:sSkills,
    talente:sTalente, persoenlichkeit:sPersoenlichkeit, beziehungen:sBeziehungen,
    ausruestung:sAusruestung, bogen:sBogen,
  }[s];
  return fn();
}

      ${PRESETS.map(p=>`<div class="konzept" data-action="preset" data-id="${p.id}">
        <b>${esc(p.name)}</b><small>${esc(p.konzept)} — ${esc(p.kurz)}</small></div>`).join('')}

function sGrundlagen(){
  return `<div class="panel">
    <h2>Die Regeln in fünf Minuten</h2>
    <p class="lead">Dieses Spiel nutzt Hausregeln im Geist von <i>Savage Worlds</i>: schnelle Würfe, kompetente Held:innen, dramatische Momente.</p>

    <div class="lehr"><h4>1 · Würfelstufen</h4>
      Alles — Attribute wie Fertigkeiten — wird durch einen Würfel dargestellt. Je größer der Würfel, desto besser:
      <p style="text-align:center;font-size:1.2rem;color:var(--gold2);margin:.5em 0">d4 → d6 → d8 → d10 → d12</p>
      <div>Die Würfelstufe ist die <b>Bewertung</b> deiner Figur — <b>kein einmaliges Auswürfeln</b>. Bei der Erschaffung <b>verteilst</b> du diese Stufen mit Punkten; nichts wird zufällig bestimmt. Gewürfelt wird erst <b>im Spiel</b>: Dann wirfst du genau diesen Würfel (plus den Wild Die) und vergleichst mit dem Zielwert. <b>Attribute</b> beginnen bei <b>d4</b>, <b>Fertigkeiten</b> beginnen „<b>untrainiert</b>" (noch kein Würfel) und werden mit Punkten auf d4 und höher gebracht.</div>
    </div>

    <div class="lehr"><h4>2 · Die Probe</h4>
      Willst du etwas Schwieriges, würfelst du deinen <b>Fertigkeits-Würfel</b> zusammen mit einem <b>Wild&nbsp;Die (d6)</b> und nimmst das <b>höhere</b> Ergebnis. Der Wild Die ist dein Heldenbonus — normale Leute (NSCs) haben ihn nicht.
    </div>
    <div class="beispiel"><b>Beispiel:</b> Deine Schießen-Fertigkeit ist d8. Du würfelst d8 = <b>5</b> und Wild Die d6 = <b>3</b>. Es zählt die <b>5</b>.</div>

    <div class="lehr"><h4>3 · Explodierende Würfel</h4>
      Zeigt ein Würfel sein <b>Höchstergebnis</b>, wird er <b>erneut geworfen und dazugezählt</b> — und das immer wieder, solange das Maximum fällt. So kann selbst ein kleiner Würfel einen gewaltigen Erfolg landen.
    </div>
    <div class="beispiel"><b>Beispiel:</b> Dein d8 zeigt <b>8</b> → also nochmal: <b>5</b>. Das Würfelergebnis ist 8 + 5 = <b>13</b>.</div>

    <div class="lehr"><h4>4 · Zielwert 4</h4>
      Der Standard-Zielwert ist <b>4</b>. Wer 4 oder mehr erreicht, hat Erfolg. Schwierige Umstände geben Boni oder Abzüge (leicht +1/+2, schwierig −2, sehr schwierig −4).
    </div>

    <div class="lehr"><h4>5 · Steigerungen (Raises)</h4>
      Für je <b>4 Punkte über dem Zielwert</b> gelingt die Probe besonders gut — eine „Steigerung". Ergebnis 8 = 1 Steigerung, 12 = 2 Steigerungen: mehr Schaden, mehr Tempo, eine bessere Position.
    </div>

    <div class="lehr"><h4>6 · Schicksalspunkte</h4>
      Du startest jede Sitzung mit <b>3 Schicksalspunkten</b>. Damit kannst du einen Wurf <b>wiederholen</b>, <b>Schaden abwehren</b> oder <b>einen glücklichen Zufall</b> zu deinen Gunsten erzählen. Setze sie mutig ein — sie sind der Stoff, aus dem Held:innen überleben.
    </div>

    <div class="lehr"><h4>7 · Wie Kampf funktioniert</h4>
      <ul style="margin:.3em 0 0;padding-left:18px">
        <li><b>Treffen:</b> Du greifst mit <b>Nahkampf</b> (im Handgemenge) oder <b>Schießen</b> (auf Distanz) an. Der Nahkampf muss die <b>Parade</b> des Ziels erreichen, ein Schuss meist die 4.</li>
        <li><b>Schaden:</b> Bei einem Treffer würfelst du Schaden gegen die <b>Robustheit</b> des Ziels. Erreichst du sie, ist das Ziel <b>angeschlagen</b>; für je 4 darüber gibt es eine <b>Wunde</b> (−1 auf Proben je Wunde).</li>
        <li><b>Angeschlagen:</b> Wer angeschlagen ist, muss sich erst wieder fangen, bevor er richtig handeln kann.</li>
        <li><b>Held:innen bluffen dem Tod:</b> Mit einem <b>Schicksalspunkt</b> wiederholst du einen verpatzten Angriff oder wehrst eine Wunde ab.</li>
      </ul>
    </div>

    <div class="nav">
      <button class="ghost" data-action="prev">← Zurück</button>
      <button class="prim" data-action="next">Weiter →</button>
    </div>
  </div>`;
}

function sSetting(){
  return `<div class="panel">
    <h2>Das Setting: Gévaudan, Winter 1764</h2>
    <div class="lehr"><h4>Was geschieht</h4>
      In der abgelegenen Hochlandprovinz <b>Gévaudan</b> (die kargen Berge der <b>Margeride</b>) zerreißt in diesem einen bitteren Winter etwas die Menschen auf dem offenen Moor — Kehlen aufgerissen, halb gefressen. Die Opfer sind fast immer die Armen: Frauen, Hirt:innen und Kinder, die die Herde hüten. Die Kirche nennt es Gottes Strafe, die Bauern flüstern „<b>loup-garou</b>", und die Krone will die Sache tot sehen, ehe die Panik das ganze Land ergreift. Kein Zeuge beschreibt das Untier gleich.
    </div>
    <div class="lehr"><h4>Der Ort: Le Malzieu</h4>
      Basis ist die befestigte Kleinstadt <b>Le Malzieu</b> — Mauern, ein Tor, ein Gasthaus, eine Kirche, ein paar Honoratioren. Von hier strahlen alle Wege hinaus zu den Weilern, Weiden und Wäldern des Gévaudan. Der Syndic, der Dragonerhauptmann und der Pfarrer sind sich offen uneins, wie mit dem Grauen umzugehen ist. Man geht nicht mehr allein vor die Mauern.
    </div>
    <div class="lehr"><h4>Der Ton</h4>
      Historischer Horror-Krimi: neblige Wälder, tiefe Armut, Frömmigkeit, die in Aberglauben kippt, Kerzenlicht und Gebete. Der Schrecken entsteht aus <b>Ungewissheit</b> — Wolf? Abgerichtetes Tier? Verfluchter Mensch? — nicht aus offenem Kampf. Erst wird ermittelt, dann gejagt.
    </div>
    <div class="lehr"><h4>Eure Rolle: Fremde im verängstigten Land</h4>
      Ihr seid <b>Fremde</b>, die in diese Region gezogen sind, um einen Mörder zu jagen, den keine zwei Zeugen gleich beschreiben. Jäger, Soldaten, Wilderer, Geistliche, Heilerinnen, Gelehrte. Die Einheimischen misstrauen euch — ihr stellt euch der Bestie, schützt die Weiler und sucht die Wahrheit hinter dem Grauen, mit Muskete, Verstand, Glaube und Mut.
    </div>
    <div class="lehr"><h4>Aberglaube &amp; das Okkulte</h4>
      Was das Volk glaubt, kann Leben retten oder kosten — aber <b>zeig dein Wissen nicht offen</b>. Man erzählt sich von verfluchten Männern, von Schutzzeichen und Ritualen; <b>der Überlieferung nach</b> beißt nur geweihtes <b>Silber</b> den loup-garou. Ob an alldem etwas Wahres ist, weiß niemand. Wer mit okkultem Wissen oder „heidnischen" Mitteln hantiert, gilt der wachsamen Kirche schnell als Hexe oder Ketzer — solche Fähigkeiten (etwa die Fertigkeit <b>Okkultismus</b>) nutzt man <b>diskret</b>.
    </div>
    <div class="nav">
      <button class="ghost" data-action="prev">← Zurück</button>
      <button class="prim" data-action="next">Konzept wählen →</button>
    </div>
  </div>`;
}

function sAttribute(){
  const used = attrGenutzt(), total = attrBudget(), rest = total-used;
  return `<div class="panel">
    <h2>Attribute</h2>
    <div class="lehr"><h4>Die fünf Grundwerte</h4>
      Alle Attribute beginnen bei <b>d4</b>. Du hast <b>${total} Steigerungen</b> — jede hebt ein Attribut um eine Würfelstufe (max. d12). Verteile sie nach dem Bild deiner Figur.</div>
    <div class="lehr"><h4>Warum zuerst die Attribute?</h4>
      Attribute sind das Fundament deiner Fertigkeiten: Eine Fertigkeit lässt sich <b>bis zur Höhe ihres Attributs günstig</b> steigern (1 Punkt je Stufe), <b>darüber kostet sie doppelt</b>. Ein starkes Attribut macht seine Fertigkeiten also billiger <i>und</i> stärker — plane die Attribute mit Blick auf die Fertigkeiten, die dir am wichtigsten sind.</div>
    ${budgetBar([{label:'Steigerungen',used,total,rest}])}
    ${rest<0?`<div class="banner bad">Du hast mehr Steigerungen verteilt, als du hast. Nimm irgendwo zurück.</div>`:''}
    ${ATTRIBUTE.map(a=>{
      const die = character.attribute[a.id];
      const kannRauf = idx(die)<4 && rest>0;
      const kannRunter = idx(die)>0;
      return `<div class="steprow">
        <div class="nm"><b>${a.name}</b><small>${a.kurz} · ${a.bsp}</small></div>
        <button class="round" data-action="attr-down" data-id="${a.id}" ${kannRunter?'':'disabled'}>−</button>
        <span class="die">${die}</span>
        <button class="round" data-action="attr-up" data-id="${a.id}" ${kannRauf?'':'disabled'}>+</button>
      </div>`;
    }).join('')}
    <div class="nav">
      <button class="ghost" data-action="prev">← Zurück</button>
      <button class="prim" data-action="next">Weiter →</button>
    </div>
  </div>`;
}

function sNachteile(){
  const frei = nachteilPunkteFrei(), verdient = nachteilPunkteVerdient();
  const g = nachteilAnzahl('gross'), k = nachteilAnzahl('klein');
  return `<div class="panel">
    <h2>Nachteile</h2>
    <div class="lehr"><h4>Ecken, Kanten — und Baupunkte</h4>
      Nachteile machen deine Figur interessant und geben dir zusätzliche Punkte. Wähle bis zu <b>1 großen</b> (2 Punkte) und <b>2 kleine</b> (je 1 Punkt). Die Punkte tauschst du unten gegen mehr Attribute, Talente oder Fertigkeiten.</div>
    <div class="budget no-print">
      <div class="b">Große: <b>${g}</b>/${RULES.MAX_NACHTEIL_GROSS}</div>
      <div class="b">Kleine: <b>${k}</b>/${RULES.MAX_NACHTEIL_KLEIN}</div>
      <div class="b">Punkte gesamt: <b class="zero">${verdient}</b></div>
      <div class="b">Frei verfügbar: <b class="${frei<0?'over':'ok'}">${frei}</b></div>
    </div>
    ${NACHTEILE.map(n=>{
      const on = character.nachteile.some(x=>x.id===n.id);
      const grenze = !on && ((n.schwere==='gross'&&g>=RULES.MAX_NACHTEIL_GROSS)||(n.schwere==='klein'&&k>=RULES.MAX_NACHTEIL_KLEIN));
      return `<div class="selrow ${on?'on':''}" data-action="toggle-nachteil" data-id="${n.id}" style="${grenze?'opacity:.4':''}">
        <div class="box">${on?'✓':''}</div>
        <div class="txt"><b>${esc(n.name)} <span class="tag ${n.schwere}">${n.schwere==='gross'?'Groß · 2':'Klein · 1'}</span></b><small>${esc(n.text)}</small></div>
      </div>`;
    }).join('')}

    <h3 style="margin-top:22px">Punkte eintauschen</h3>
    <div class="grid g3">
      ${umwandlungKarte('Attribut-Steigerung','attribut',2,'+1 Attribut-Stufe')}
      ${umwandlungKarte('Talent','talente',2,'+1 zusätzliches Talent')}
      ${umwandlungKarte('Fertigkeitspunkt','skills',1,'+1 Skillpunkt')}
    </div>
    <div class="nav">
      <button class="ghost" data-action="prev">← Zurück</button>
      <button class="prim" data-action="next">Weiter →</button>
    </div>
  </div>`;
}
function umwandlungKarte(name, key, kosten, hinweis){
  const val = character.umwandlung[key];
  const kannRauf = nachteilPunkteFrei() >= kosten;
  const kannRunter = val>0;
  return `<div class="card" style="text-align:center">
    <b>${name}</b><div class="tip" style="margin:2px 0 8px">${hinweis} · Kosten ${kosten}</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:12px">
      <button class="round" data-action="umw-down" data-key="${key}" ${kannRunter?'':'disabled'}>−</button>
      <span class="die">${val}</span>
      <button class="round" data-action="umw-up" data-key="${key}" data-kosten="${kosten}" ${kannRauf?'':'disabled'}>+</button>
    </div>
  </div>`;
}

function sSkills(){
  const used = skillGenutzt(), total = skillBudget(), rest = total-used;
  let html = `<div class="panel">
    <h2>Fertigkeiten</h2>
    <div class="lehr"><h4>Was du gelernt hast</h4>
      Jede Fertigkeit hängt an einem Attribut. <b>Bis zur Höhe des Attributs</b> kostet jede Stufe <b>1 Punkt</b>, <b>darüber 2 Punkte</b>. Du hast <b>${total} Punkte</b>.</div>
    <div class="beispiel">Geschick d8, Schießen bis d8 → je Stufe 1 Punkt. Der Schritt auf d10 (über dem Attribut) kostet dann 2.</div>
    <div class="lehr" style="border-left-color:var(--blut2)"><h4>Vorsicht: Okkultismus</h4>
      Okkultes Wissen ist selten und heikel. Offen gezeigt weckt es Verdacht auf Hexerei — die Fertigkeit <b>Okkultismus</b> setzt man im Spiel besser <b>diskret</b> ein.</div>
    ${budgetBar([{label:'Fertigkeitspunkte',used,total,rest}])}
    ${rest<0?`<div class="banner bad">Zu viele Punkte ausgegeben — reduziere Fertigkeiten (oder erhöhe das passende Attribut).</div>`:''}`;
  ATTRIBUTE.forEach(a=>{
    const skills = SKILLS.filter(s=>s.attr===a.id);
    if(!skills.length) return;
    html += `<div class="attrgroup"><div class="ttl"><b>${a.name}</b> <small>Attribut: ${character.attribute[a.id]}</small></div>`;
    skills.forEach(s=>{
      const die = character.skills[s.id] || null;
      const rauf = stepKostenRauf(character.attribute[a.id], die);
      const kannRauf = rauf!=null && rest>=rauf;
      const kannRunter = die!=null;
      const naechste = die==null?'d4':(WUERFEL[idx(die)+1]||null);
      html += `<div class="steprow">
        <div class="nm"><b>${s.name}</b>${die?'':`<small>untrainiert</small>`}</div>
        <span class="cost">${naechste&&rauf!=null?`nächste: ${rauf}`:''}</span>
        <button class="round" data-action="skill-down" data-id="${s.id}" ${kannRunter?'':'disabled'}>−</button>
        <span class="die ${die?'':'untr'}">${die||'—'}</span>
        <button class="round" data-action="skill-up" data-id="${s.id}" ${kannRauf?'':'disabled'}>+</button>
      </div>`;
    });
    html += `</div>`;
  });
  html += `<div class="nav">
      <button class="ghost" data-action="prev">← Zurück</button>
      <button class="prim" data-action="next">Weiter →</button>
    </div></div>`;
  return html;
}

function sTalente(){
  const used = character.talente.length, total = talentBudget(), rest = total-used;
  return `<div class="panel">
    <h2>Talente</h2>
    <div class="lehr"><h4>Deine besonderen Kniffe</h4>
      Talente (Edges) sind kleine Sonderregeln, die deine Figur prägen. Du erhältst <b>${RULES.GRATIS_TALENTE} gratis</b>${character.umwandlung.talente?` (+${character.umwandlung.talente} aus Nachteilen)`:''}. Wähle <b>${total}</b> Talent(e).</div>

      const grenze = !on && used>=total;
      return `<div class="selrow ${on?'on':''}" data-action="toggle-talent" data-id="${t.id}" style="${grenze?'opacity:.4':''}">
        <div class="box">${on?'✓':''}</div>
        <div class="txt"><b>${esc(t.name)}</b><small>${esc(t.text)}</small></div>
      </div>`;
    }).join('')}
    <div class="nav">
      <button class="ghost" data-action="prev">← Zurück</button>
      <button class="prim" data-action="next">Weiter →</button>
    </div>
  </div>`;
}

function sPersoenlichkeit(){
  return `<div class="panel">
    <h2>Persönlichkeit, Motivation &amp; Geschichte</h2>
    <div class="lehr"><h4>Die Seele der Figur</h4>
      Hier entsteht, wer dein Charakter wirklich ist. Nutze die Felder als Anregung — ein, zwei Sätze genügen schon.</div>
    <div class="grid g2">
      ${feld('Wesenszüge','profil.wesenszuege',{ph:'stur, warmherzig, verschlossen …'})}
      ${feld('Aberglaube / Ritual','profil.aberglaube',{ph:'Salz an der Schwelle, nie nachts pfeifen …'})}
      ${feld('Tugend','profil.tugend',{ph:'Mut, Treue, Mitgefühl …'})}
      ${feld('Laster','profil.laster',{ph:'Stolz, Jähzorn, Branntwein …'})}

function pruefWarnungen(){
  const w=[];
  const ar = attrBudget()-attrGenutzt();
  if(ar>0) w.push(`Du hast noch <b>${ar}</b> Attribut-Steigerung(en) übrig.`);
  if(ar<0) w.push(`Du hast <b>${-ar}</b> Attribut-Steigerung(en) zu viel verteilt.`);
  const sr = skillBudget()-skillGenutzt();
  if(sr>0) w.push(`Du hast noch <b>${sr}</b> Fertigkeitspunkt(e) übrig.`);
  if(sr<0) w.push(`Du hast <b>${-sr}</b> Fertigkeitspunkt(e) zu viel ausgegeben.`);
  const tr = talentBudget()-character.talente.length;
  if(tr>0) w.push(`Du kannst noch <b>${tr}</b> Talent(e) wählen.`);
  if(nachteilPunkteFrei()<0) w.push(`Du hast mehr Nachteil-Punkte eingetauscht als vorhanden.`);
  if(!character.meta.name) w.push(`Deine Figur hat noch keinen <b>Namen</b>.`);
  return w;
}

function kraftText(k){ const def=BESTIENKRAEFTE.find(x=>x.id===k.id); return k.text||(def?def.text:''); }
function silberText(s){

}

   ========================================================================= */
function istSL(){ return location.hash.replace('#','').toLowerCase()==='sl'; }

function renderApp(){
  document.body.classList.toggle('sl', istSL());
  const app = document.getElementById('app');
  const db = document.getElementById('druckbereich');
  if(istSL()){
    app.innerHTML = renderSL();
    renderBogen();
    db.classList.remove('zeige');
  } else {
    app.innerHTML = renderProgress() + renderSchritt();
    if(SCHRITTE[schritt].id==='bogen'){ renderBogen(); db.classList.add('zeige'); }
    else db.classList.remove('zeige');
    // Fortschritt an aktive Position scrollen
    const active = app.querySelector('.progress .active');
    if(active) active.scrollIntoView({inline:'center',block:'nearest'});
  }
  autosave();
}
function renderProgress(){
  return `<div class="progress no-print">${SCHRITTE.map((s,i)=>
    `<button data-action="goto" data-i="${i}" class="${i===schritt?'active':''} ${i<schritt?'done':''}"><span class="n">${i+1}</span>${s.name}</button>`
  ).join('')}</div>`;
}
function goto(i){ schritt = Math.max(0, Math.min(SCHRITTE.length-1, i)); window.scrollTo(0,0); renderApp(); }

/* =========================================================================
   EVENT-DELEGATION
   ========================================================================= */
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset && t.dataset.path){ setPath(character, t.dataset.path, t.value); touch(); autosave(); }
});
function setPath(obj, path, val){
  const parts = path.split('.');
  let o = obj;
  for(let i=0;i<parts.length-1;i++){
    const k = parts[i];
    if(o[k]==null) o[k] = /^\d+$/.test(parts[i+1]) ? [] : {};
    o = o[k];
  }
  o[parts[parts.length-1]] = val;
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  const D = el.dataset;
  switch(a){
    case 'next': goto(schritt+1); break;
    case 'prev': goto(schritt-1); break;
    case 'goto': goto(+D.i); break;
    case 'beispiel': ladeBeispiel(); break;
    case 'preset': ladePreset(D.id); break;
    case 'konzept': character.meta.konzept = D.name; touch(); renderApp(); break;

    case 'attr-up': { const id=D.id, dd=character.attribute[id];
      if(idx(dd)<4 && attrGenutzt()<attrBudget()){ character.attribute[id]=WUERFEL[idx(dd)+1]; touch(); renderApp(); } break; }
    case 'attr-down': { const id=D.id, dd=character.attribute[id];
      if(idx(dd)>0){ character.attribute[id]=WUERFEL[idx(dd)-1]; touch(); renderApp(); } break; }

    case 'skill-up': { const id=D.id, def=SKILLS.find(s=>s.id===id), cur=character.skills[id]||null;
      const kosten=stepKostenRauf(character.attribute[def.attr],cur);
      if(kosten!=null && (skillBudget()-skillGenutzt())>=kosten){
        character.skills[id]= cur==null?'d4':WUERFEL[idx(cur)+1]; touch(); renderApp(); } break; }
    case 'skill-down': { const id=D.id, cur=character.skills[id];
      if(cur){ if(idx(cur)===0) delete character.skills[id]; else character.skills[id]=WUERFEL[idx(cur)-1]; touch(); renderApp(); } break; }

    case 'toggle-nachteil': toggleNachteil(D.id); break;
    case 'umw-up': { const key=D.key, kosten=+D.kosten; if(nachteilPunkteFrei()>=kosten){ character.umwandlung[key]++; touch(); renderApp(); } break; }
    case 'umw-down': { const key=D.key; if(character.umwandlung[key]>0){ character.umwandlung[key]--; touch(); renderApp(); } break; }

    case 'toggle-talent': toggleTalent(D.id); break;

    case 'rel-add': character.beziehungen.push({name:'',beziehung:''}); touch(); renderApp(); break;
    case 'rel-remove': character.beziehungen.splice(+D.i,1); touch(); renderApp(); break;

    case 'ausr-inc': ausrSet(D.name, ausrMenge(D.name)+1); touch(); renderApp(); break;
    case 'ausr-dec': ausrSet(D.name, ausrMenge(D.name)-1); touch(); renderApp(); break;
    case 'ausr-add': { const inp=document.getElementById('ausr-neu'); const v=(inp.value||'').trim();
      if(v){ ausrSet(v, ausrMenge(v)+1); touch(); renderApp(); } break; }

    case 'print': renderBogen(); setTimeout(()=>window.print(),60); break;
    case 'save-html': speichernAlsHtml(); break;
    case 'export-json': exportJson(); break;
    case 'menu-json': menuJson(); break;
    case 'reset': if(confirm('Neuen Charakter beginnen? Der aktuelle wird aus diesem Browser entfernt (gespeicherte Dateien bleiben).')){ character=defaultCharacter(); schritt=0; autosave(); if(istSL()) location.hash=''; else renderApp(); } break;

    /* SL */
    case 'sl-import': triggerImport('sl'); break;
    case 'sl-local': { try{ const s=localStorage.getItem(LS_KEY); if(s){ character=migrate(JSON.parse(s)); renderApp(); } }catch(err){ alert('Nichts gespeichert gefunden.'); } break; }
    case 'sl-paste-toggle': { const p=document.getElementById('sl-paste'); p.style.display = p.style.display==='none'?'block':'none'; break; }
    case 'sl-paste-load': { try{ character=migrate(JSON.parse(document.getElementById('sl-paste-ta').value)); renderApp(); }catch(err){ alert('Ungültiges JSON.'); } break; }
    case 'sl-neu': if(confirm('Neuen Bestien-NSC anlegen?')){ character=defaultCharacter(); character.bestie.aktiv=true; renderApp(); } break;
    case 'sl-vater': if(confirm('Den Vater (Antagonist-NSC) laden? Ein geladener Charakter wird ersetzt.')){ ladeVaterNSC(); } break;
    case 'sl-instinkt': character.bestie.instinkt=+D.wert; character.bestie.aktiv=true; touch(); renderApp(); break;
    case 'sl-ausloeser': character.bestie.instinkt=Math.max(0,Math.min(5,character.bestie.instinkt+ +D.wert)); character.bestie.aktiv=true; touch(); renderApp(); break;
    case 'sl-kraft': slToggleKraft(D.id); break;
    case 'sl-silber': character.bestie.silber[D.key]=!character.bestie.silber[D.key]; character.bestie.aktiv=true; touch(); renderApp(); break;
    case 'sl-kontrolle': character.bestie.kontrolle=Math.max(0,character.bestie.kontrolle+ +D.d); touch(); renderApp(); break;
  }
});

function toggleNachteil(id){
  const n = NACHTEILE.find(x=>x.id===id); if(!n) return;
  const i = character.nachteile.findIndex(x=>x.id===id);
  if(i>=0){ character.nachteile.splice(i,1); }
  else{
    if(n.schwere==='gross' && nachteilAnzahl('gross')>=RULES.MAX_NACHTEIL_GROSS) return;
    if(n.schwere==='klein' && nachteilAnzahl('klein')>=RULES.MAX_NACHTEIL_KLEIN) return;
    character.nachteile.push({id:n.id,name:n.name,schwere:n.schwere,text:n.text});
  }
  // Umwandlung ggf. auf verfügbare Punkte begrenzen
  clampUmwandlung(); touch(); renderApp();
}
function clampUmwandlung(){
  let frei = nachteilPunkteVerdient();
  // Reihenfolge: attribut(2), talente(2), skills(1) — überschüssige zurücknehmen
  const order=[['attribut',2],['talente',2],['skills',1]];
  let genutzt = umwandlungGenutzt();
  while(genutzt>frei){
    let reduced=false;
    for(const [k,c] of order){ if(character.umwandlung[k]>0){ character.umwandlung[k]--; genutzt-=c; reduced=true; break; } }
    if(!reduced) break;
  }
}
function toggleTalent(id){
  const t = TALENTE.find(x=>x.id===id); if(!t) return;
  const i = character.talente.findIndex(x=>x.id===id);
  if(i>=0) character.talente.splice(i,1);
  else{ if(character.talente.length>=talentBudget()) return; character.talente.push({id:t.id,name:t.name,text:t.text}); }
  touch(); renderApp();
}
function ausrMenge(name){ const e=character.ausruestung.find(x=>x.name===name); return e?e.menge:0; }
function ausrSet(name, menge){
  menge = Math.max(0, menge);
  const i = character.ausruestung.findIndex(x=>x.name===name);
  if(menge===0){ if(i>=0) character.ausruestung.splice(i,1); }
  else if(i>=0) character.ausruestung[i].menge = menge;
  else character.ausruestung.push({name, menge});
}
function slToggleKraft(id){
  const k = BESTIENKRAEFTE.find(x=>x.id===id); if(!k) return;
  const i = character.bestie.kraefte.findIndex(x=>x.id===id);
  if(i>=0) character.bestie.kraefte.splice(i,1);
  else character.bestie.kraefte.push({id:k.id,name:k.name,text:k.text});
  character.bestie.aktiv=true; touch(); renderApp();
}

function menuJson(){
  const wahl = prompt('Aktion wählen:\n1 = Charakter aus Datei laden (JSON/HTML)\n2 = Als JSON exportieren\n\nNummer eingeben:');
  if(wahl==='1') triggerImport('creator');
  else if(wahl==='2') exportJson();
}

  c.nachteile=[{id:'gejagt',name:'Gejagt',schwere:'gross',text:NACHTEILE.find(n=>n.id==='gejagt').text},
               {id:'aberglaube',name:'Aberglaube',schwere:'klein',text:NACHTEILE.find(n=>n.id==='aberglaube').text}];
  c.umwandlung={attribut:0,talente:1,skills:1}; // 3 Nachteil-Punkte: 1 Talent(2) + 1 Skillpunkt(1)

  c.skills={schiessen:'d8',heimlichkeit:'d6',ueberleben:'d6',wahrnehmung:'d6',nahkampf:'d4',natur:'d6',reiten:'d4'};
  c.talente=[{id:'faehrtenleser',name:'Fährtenleser',text:TALENTE.find(t=>t.id==='faehrtenleser').text},
             {id:'jaeger',name:'Jäger',text:TALENTE.find(t=>t.id==='jaeger').text}];
  c.ausruestung=[{name:'Steinschlossmuskete',menge:1},{name:'Jagdmesser',menge:1},{name:'Silberkugeln',menge:6},{name:'Wolfsfalle',menge:1},{name:'Laterne',menge:1}];
  c.profil=Object.assign(c.profil,{wesenszuege:'zäh, wortkarg, loyal',tugend:'Mut',laster:'Rachsucht',
    motivation:'Die Bestie tötete ihre Schwester. Sie wird nicht ruhen.',ziele:'Den Kopf der Bestie über die Türschwelle nageln.',
    aengste:'Die Nächte, in denen das Heulen näher kommt.',geheimnis:'In jener Nacht ließ sie ihre Schwester aus Angst allein — sie gibt sich die Schuld.',
    hintergrund:'Aufgewachsen in den Wäldern der Margeride, lebte Jeanne vom Wildern, bis die Bestie kam.'});
  c.beziehungen=[{name:'Marie',beziehung:'tote Schwester (Opfer der Bestie)'},{name:'Pater Anselme',beziehung:'misstrauischer Verbündeter'}];

/* ---------- Fertige Vorlage laden ---------- */
function ladePreset(id){
  const pre = PRESETS.find(p=>p.id===id); if(!pre) return;
  const c = defaultCharacter();
  c.meta = Object.assign(c.meta, {name:pre.name, konzept:pre.konzept, stand:pre.stand||'', herkunftsort:pre.herkunftsort||''});
  c.attribute = Object.assign(c.attribute, pre.attribute);
  c.skills = Object.assign({}, pre.skills);
  c.talente = (pre.talente||[]).map(tid=>{ const t=TALENTE.find(x=>x.id===tid); return {id:t.id,name:t.name,text:t.text}; });
  c.ausruestung = (pre.ausruestung||[]).map(([name,menge])=>({name, menge}));
  c.profil = Object.assign(c.profil, pre.profil||{});
  character = c; schritt = SCHRITTE.findIndex(s=>s.id==='bogen'); touch(); autosave(); renderApp();
}

/* ---------- Vater-NSC (zentraler Antagonist, nur SL) ----------
   Der Hüter der Bestie: ein trauernder Einheimischer, der den Wolf hegt und lenkt
   und dabei selbst verfällt. Werte niedrig-menschlich, Willenskraft hoch. Alle
   Profil-/Notizfelder sind bewusst AMBIVALENT — das Vater-Sohn-Geheimnis bleibt
   SL-Wissen und wird nirgends als Fakt bestätigt. */
function ladeVaterNSC(){
  const c = defaultCharacter();
  c.meta = Object.assign(c.meta, {
    name:'Der Vater', beiname:'der Hirte, der nicht mehr spricht',
    konzept:'Trauernder Einheimischer, der die Bestie hegt und lenkt',
    alter:'alt vor der Zeit', herkunftsort:'ein Weiler bei Le Malzieu', stand:'Hirte / Jäger',
    konfession:'einst fromm — jetzt betet er zu etwas anderem',
    aussehen:'Ausgezehrt, verfilztes Haar, wunde Hände, ein Blick, der durch dich hindurchgeht. Manche schwören, seine Zähne stünden zu weit vor.'});
  // niedrig-menschlich, Willenskraft hoch
  c.attribute = {kraft:'d6',geschick:'d6',zaehigkeit:'d8',verstand:'d4',willenskraft:'d12'};
  c.skills = {ueberleben:'d8',natur:'d8',heimlichkeit:'d6',wahrnehmung:'d6',einschuechtern:'d6',nahkampf:'d4'};
  c.ausruestung = [{name:'Hirtenstab',menge:1},{name:'Jagdmesser',menge:1},{name:'Wildköder',menge:1},{name:'Wolldecke',menge:1}];
  c.profil = Object.assign(c.profil, {
    wesenszuege:'still, ausdauernd, unerreichbar hinter der Trauer',
    motivation:'Er beschützt das Tier wie sein eigen Kind — koste es, was es wolle.',
    aengste:'Dass man ihm das Tier nimmt. Ein zweites Mal.',
    // bewusst doppeldeutig gehalten — SL löst es nie ganz auf:
    geheimnis:'Sein Sohn (junger Hirte/Jäger) kam ums Leben. Seither ist er überzeugt, der Geist des Sohnes sei in den Wolf gefahren, den er beim Leichnam fand — ODER die Trauer hat ihn zerbrochen und eine Tollwut, die beide befallen hat, tut den Rest. Beide Lesarten offenhalten.',
    hintergrund:'Er füttert das Tier, pflegt es, lenkt es zu den Opfern und wird selbst langsam „zum Wolf" (Haare, Zähne, Kriechen, Verlust der Sprache). Täter UND Opfer. Das Monster ist ein Tier; der wahre Antagonist ist ein sich auflösender Mensch. Den Wolf zu töten heißt womöglich, den Sohn ein zweites Mal zu töten.',
    notizen:'SL-only. Vor Spielern nur als verstörter Einheimischer auftreten lassen.'});
  c.beziehungen = [{name:'Der Wolf',beziehung:'„der Sohn" — das Tier, das er hegt und lenkt'},
                   {name:'Der tote Sohn',beziehung:'Hirte/Jäger, umgekommen (Auslöser von allem)'}];
  // Bestien-Ebene: mittlere Stufe, passende Kräfte
  c.bestie.aktiv = true;
  c.bestie.instinkt = 3;
  c.bestie.kraefte = ['geruch','nachtsicht','rudel','staerke'].map(id=>{
    const k = BESTIENKRAEFTE.find(x=>x.id===id); return {id:k.id,name:k.name,text:k.text};
  });
  c.bestie.verwandlung = 'schleichend über den Winter — kein Zurück in Sicht';
  c.bestie.lesart = 'Offen halten: „Der Geist des Sohnes lenkt den Wolf" gegen „Trauer-Psychose + Tollwut bei Mann und Tier". Kein Hinweis bestätigt das eine allein.';
  c.bestie.notizen = 'Der Vater ist der Hüter, nicht die Bestie selbst — die Bestie ist der Wolf, den er lenkt. Diese Bestien-Werte bilden seinen eigenen, langsamen Verfall ab.';
  character = c; schritt = SCHRITTE.findIndex(s=>s.id==='bogen'); touch(); autosave(); renderApp();
}
